services:
  minio:
    image: chainguard/minio:latest
    container_name: clipsync-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clipsync-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: clipsync-worker
    command: python3 -m src.worker.main
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - PYTHONPATH=/app
    volumes:
      - ./apps/backend:/app
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    container_name: clipsync-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - PYTHONPATH=/app
    volumes:
      - ./apps/backend:/app
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: clipsync-frontend
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
    depends_on:
      - api
    restart: unless-stopped

volumes:
  minio_data:
