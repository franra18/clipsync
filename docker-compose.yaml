
services:
  minio:
    image: chainguard/minio:latest
    container_name: clipssync-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clipssync-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  minio_data:
